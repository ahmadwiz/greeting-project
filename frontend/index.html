<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Greeting Website</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main>
    <h1>My Greeting Website</h1>

    <section>
      <h2>Server Time</h2>
      <p>Click the button to load or reload the time from the server.</p>
      
      <form id="time-form" method="GET" action="http://localhost:5000/time">
        <button type="submit">Load time</button>
      </form> 

      <p id="time-result" role="status"></p>
    </section>

    <section>
      <h2>Get a Greeting</h2>

      <form id="greeting-form" method="POST" action="http://localhost:5000/greet">
        <label for="name">Enter your name:</label>
        <input id="name" type="text" required>
        <button type="submit">Submit</button>
      </form>

      <p id="greeting-result" role="status"></p>
    </section>
  </main>
</body>
</html>
